[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mental-health-federated-ai"
version = "0.1.0"
description = "Privacy-Preserving Real-Time Multimodal Mental Health Risk Assessment Using Federated Learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mental Health AI Team"}
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
