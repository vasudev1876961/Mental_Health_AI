version: '3.8'

services:
  dashboard:
    build: .
    container_name: mental_health_dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0

  api_server:
    build: .
    container_name: mental_health_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000
