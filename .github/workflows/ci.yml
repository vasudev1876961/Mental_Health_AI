name: CI - Multimodal Mental Health FL Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Full Unit Test Suite (39 Tests)
      run: |
        python -m unittest discover -s tests

    - name: Verify Synthetic Data Generator
      run: |
        python -m src.data.dataset_generator --num-subjects 10 --output-dir data/ci_test

    - name: Run Fast Experiment Runner Verification
      run: |
        python experiments/run_experiments.py --mode fast
